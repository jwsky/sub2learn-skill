name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Playwright Chromium (setup.sh, OCR, translate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skills/sub2learn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup (npm ci + Chromium with system libraries)
        run: bash scripts/setup.sh
      - name: Self-test against sub2learn.com
        run: node scripts/s2l.mjs selftest --with-ocr --with-translate

  google-chrome:
    name: System Google Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/sub2learn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup (npm ci only, browser comes from the runner)
        run: bash scripts/setup.sh --browser none
      - name: Doctor with Google Chrome
        run: |
          google-chrome --version
          node scripts/s2l.mjs doctor --browser chrome
      - name: Self-test with Google Chrome
        run: node scripts/s2l.mjs selftest --browser chrome --with-ocr
